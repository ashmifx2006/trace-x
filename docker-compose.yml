services:
  backend:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes: ["./:/app"]
    command: sh -c "pip install -r requirements.txt && python manage.py makemigrations api && python manage.py migrate && python manage.py seed_users && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
  frontend:
    image: node:20
    working_dir: /app/frontend
    volumes: ["./:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    environment: [VITE_API=http://backend:8000]
    ports: ["5173:5173"]
